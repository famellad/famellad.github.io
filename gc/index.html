<!DOCTYPE html>
<html lang="es">
    <head>
      <meta charset="utf-8">
        <title>GC</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.css"/>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.js"></script>
        <link rel="stylesheet" href="gcstyle.css">
        <script type="text/javascript" src="https://github.com/processing/p5.js/releases/download/v1.9.0/p5.js"></script>
        <!--script type="text/javascript" src="https://famellad.github.io/js/utils.js"></script-->
        <script type="text/javascript" src="script.js" defer="defer"></script>
        <script type="text/javascript" src="drawCG.js" defer="defer"></script> 
        <script>
Coloris({
  theme: 'pill',
  themeMode: 'light',
  alpha: false,
  format:  'hex',
  formatToggle: true,
  swatches: [
    '#2f7de1',
    '#d4dcf8',
    '#dcea90',
    '#fcd700',
    '#f6a800',
    '#ee3a41',
    '#ffffff',
    '#dcdadc',
    '#54555a',
    '#000000'
  ],
});
        </script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.0/font/bootstrap-icons.css">
</head>
<body onload="readGET()">
<div id="container">
        <div id="canvasDiv"></div> <br>
        <div id="configDiv">
<form action="">
  <div class="configGrid">
    <!-- PRIMERA FILA-->
    <div class="confItem">
      <label for="nombre">Nombre:</label><br>
      <input type="text" id="nombre" name="nombre" value="SR. JUAN CARLOS DE LA LLERA"><br><br>
    </div>

    <div class="confItem">
      <label for="cPrinc">Fondo Nombre:</label><br>
      <input type="text" class="color-field" id="cPrinc" value="#2f7de1" data-coloris><br>
    </div>

    <div class="confItem">
      <label for="cPrincText">Texto Nombre:</label><br>
      <input type="text" class="color-field" id="cPrincText" value="#ffffff" data-coloris><br>
    </div>

    <!-- SEGUNDA FILA-->
    <div class="confItem">
      <label for="bajada1">Bajada:</label><br>
      <input type="text" id="bajada1" name="bajada1" value="Rector Pontificia Universidad Católica"><br>
      <input type="text" id="bajada2" name="bajada2" value=""><br><br>
    </div>
    
    <div class="confItem">
      <label for="cBajad">Fondo Bajada:</label><br>
      <input type="text" class="color-field" id="cBajad" value="#d4dcf8" data-coloris><br>
    </div>

    <div class="confItem">
      <label for="cBajadText">Texto Bajada:</label><br>
      <input type="text" class="color-field" id="cBajadText" value="#000000" data-coloris><br>
    </div>

    <!-- TERCERA FILA-->
    <div class="confItem">
      <label for="ddTheme">Tema:</label> &emsp;
      <select id="ddTheme" onchange="reloadTheme()" disabled>
        <option value="familiar" selected>Familiar</option>
        <option value="moderno">Moderno</option>
        <option value="ludico">Lúdico</option>
      </select> <br>
      <label for="ddPalette">Paleta:</label> &emsp;
      <select id="ddPalette" onchange="reloadPalette()" disabled>
        <option value="puc" selected>La UC</option>
        <option value="puc2">2</option>
        <option value="puc3">3</option>
      </select> <br>
      <label for="ddFont">Fuente:</label> &emsp;
      <select id="ddFont" onchange="writeGET()" disabled>
        <option value="oswald" selected>Oswald</option>
        <option value="fnt2">2</option>
        <option value="fnt3">3</option>
      </select> <br>
    </div>

    <div class="confItem">
      <label for="bAcento">Acento:</label>
      <input type="checkbox" id="bAcento" checked="True" onclick="writeGET()"><br> <br>
      <label for="cAcent">Color Acento:</label><br>
      <input type="text" class="color-field" id="cAcent" value="#fcd700" data-coloris><br>
    </div>

    <div class="confItem">
    </div>
  </div>
</form> 

<br>
<button id="dlButton" type="button" onClick="downloadCanvasAsImage()"><i class="bi bi-download"></i></button>

        </div>
      </div>
    </body>
</html>
